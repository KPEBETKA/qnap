version: '3'
services:
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 8080:8080/tcp
      - 6881:6881/tcp
      - 6881:6881/udp
    environment:
      - PUID=2000
      - PGID=2000
      - TZ=Europe/Moscow
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/qbittorrent/config:/config:rw
      - /share/CACHEDEV1_DATA/Public/Download:/downloads:rw
