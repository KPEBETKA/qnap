version: '3'
services:
  mtg:
    container_name: mtg
    image: nineseconds/mtg:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - mtg-external
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mtg/config.toml:/config.toml:ro
networks:
  mtg-external:
    external: true