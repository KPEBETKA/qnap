version: '3'
services:
  mtg:
    container_name: mtg
    image: nineseconds/mtg:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - mtg-external
      - mtg-internal
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mtg/config.toml:/config.toml:ro
    depends_on:
      - mtg-forwarder
  mtg-forwarder:
    container_name: mtg-forwarder
    image: valnesfjord/tg-ws-proxy-rs:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - mtg-internal
    environment:
      TG_PINNED_UPSTREAM: "mtproto"
      TG_MTPROTO_PROXY: "ip:port:secret"
      TG_SOCKS_ENABLED: "true"
      TG_SOCKS_HOST: "0.0.0.0"
      TG_SOCKS_PORT: "1080"
networks:
  mtg-external:
    external: true
  mtg-internal:
    driver: bridge