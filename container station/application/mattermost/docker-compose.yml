version: '3'
services:
  mattermost:
    container_name: mattermost
    image: mattermost/mattermost-enterprise-edition:latest
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    links:
      - postgres:postgres
    networks:
      - mattermost-external
      - mattermost-internal
    environment:
      MM_SERVICESETTINGS_SITEURL: https://mattermost.example.com
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://user:password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: ""
      PATH: /mattermost/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/client/plugins:/mattermost/client/plugins
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/config:/mattermost/config
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/data:/mattermost/data
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/logs:/mattermost/logs
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/plugins:/mattermost/plugins
    depends_on:
      - postgres
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - mattermost-internal
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mattermost
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/postgresql:/var/lib/postgresql
networks:
  mattermost-external:
    external: true
  mattermost-internal:
    driver: bridge