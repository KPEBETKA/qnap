services:
  mattermost:
    container_name: mattermost
    image: mattermost/mattermost-enterprise-edition:latest
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    links:
      - postgres:postgres
    networks:
      - mattermost-external
      - mattermost-internal
    environment:
      MM_SERVICESETTINGS_SITEURL: https://mattermost.example.com
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://user:password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: ""
      PATH: /mattermost/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TZ: Europe/Moscow
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/client/plugins:/mattermost/client/plugins
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/config:/mattermost/config
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/data:/mattermost/data
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/logs:/mattermost/logs
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/plugins:/mattermost/plugins
    depends_on:
      - postgres
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - mattermost-internal
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mattermost
      TZ: Europe/Moscow
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/postgresql:/var/lib/postgresql
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/mattermost/pgdump:/pgdump
  ofelia:
    container_name: ofelia-mm
    image: ghcr.io/netresearch/ofelia:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.mm-db-dump.no-overlap: "true"
      ofelia.job-exec.mm-db-dump.schedule: "0 5 0 * * *"
      ofelia.job-exec.mm-db-dump.container: "postgres"
      ofelia.job-exec.mm-db-dump.user: "postgres"
      ofelia.job-exec.mm-db-dump.command: >-
        sh -c 'set -e; TS=$$(date +%Y%m%d-%H%M%S);
        pg_dump -U postgres_qnap_user -d mattermost -Fc -f /pgdump/$$TS.dump;
        if [ ! -s "/pgdump/$$TS.dump" ]; then
          echo "ERROR: /pgdump/$$TS.dump is missing or empty!" >&2;
          exit 1;
        fi;
        find /pgdump -maxdepth 1 -name "*.dump" ! -name "$$TS.dump" -delete;'
    depends_on:
      - postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
networks:
  mattermost-external:
    external: true
  mattermost-internal:
    driver: bridge