version: '3'
services:
  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - 10080:80/tcp
      - 10443:443/tcp
    networks:
      - vaultwarden-external
      - mattermost-external
      - mtg-external
    volumes:
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/nginx/conf:/etc/nginx:ro
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/certbot/conf/live/example.com/privkey.pem:/etc/certbot/privkey.pem:ro
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/certbot/conf/live/example.com/fullchain.pem:/etc/certbot/pubcert.pem:ro
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/certbot/conf/live/example.com/chain.pem:/etc/certbot/trustcert.pem:ro
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/nginx/html:/usr/share/nginx/html:rw
      - /share/CACHEDEV1_DATA/Container/container-station-data/appdata/nginx/cache:/usr/share/nginx/cache:rw
networks:
  vaultwarden-external:
    external: true
  mattermost-external:
    external: true
  mtg-external:
    external: true